<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aux créas de Marie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Miranda+Sans:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">
</head>

<body>


    <main>

        <nav>
            <a href="admin.html" class="nav-link">Retour aux créations</a>
            <button id="deconnexion_admin"><img src="media/cadenas.png" alt="deconnexion admin"></button>
        </nav>

        <section class="titre">
            <h1 id="parallaxTitle">Les demandes personnalisées</h1>
        </section>

        <section class="requests-container">
            <table class="requests-table">
                <thead>
                    <tr>
                        <th>Date de la demande</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Type</th>
                        <th>Date souhaitée</th>
                        <th>Budget</th>
                        <th>Message</th>
                        <th>Photo</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="requestsBody"></tbody>
            </table>
        </section>

    </main>

    <dialog id="deleteRequestModal" class="modal-content">
        <p>Êtes-vous sûre de vouloir supprimer cette demande ?</p>
        <button id="cancelDeleteRequest" type="button" class="btn-cancel">Annuler</button>
        <button id="confirmDeleteRequest" type="button" class="btn-danger">Supprimer</button>
    </dialog>

    <script src="js/utils.js"></script>
    <script src="js/requests.js"></script>

</body>

</html>

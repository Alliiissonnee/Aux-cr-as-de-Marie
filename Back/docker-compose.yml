# Ce fichier décrit l'infrastructure de ton projet : quels "conteneurs" (environnements isolés) doivent tourner,
#  et comment ils se parlent entre eux. Tu y définis 3 services :

# mysql → ta base de données, avec ses identifiants et un stockage persistant (le volume) 
# pour que tes données ne disparaissent pas à chaque redémarrage.

# phpmyadmin → l'interface web pour gérer visuellement cette base, branchée automatiquement sur le service mysql.

# php → l'environnement qui exécute ton code PHP et le sert dans le navigateur, 
# avec tes dossiers locaux Front/, api/ et uploads/ synchronisés dedans pour que tu puisses éditer tes fichiers normalement.

# Chaque service a un port exposé différent (3306, 8082, 8000, 8025) pour que tu puisses les atteindre 
# depuis ta machine sans qu'ils se marchent dessus, et depends_on sert juste à dire dans quel ordre les démarrer.

# En résumé : ce fichier, c'est la "recette" qui dit à Docker "monte-moi ces 4 environnements, 
# connecte-les ensemble, et rends-les accessibles à ces adresses-là".

services:
  mysql:
    image: mysql:8.0
    container_name: creas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auxcreasdemarie
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: creas_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8082:80"
    depends_on:
      - mysql

  php:
    build: .
    container_name: creas_php
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      # Le front (HTML/CSS/JS/media) est la racine du site,
      # le back (API PHP et images uploadées) est branché dans les sous-dossiers api/ et uploads/.
      - ../Front:/var/www/html
      - ./api:/var/www/html/api
      - ./uploads:/var/www/html/uploads
    # Réglages des emails : lus depuis le fichier .env (voir .env.example).
    # Par défaut, les emails partent vers Mailpit, le faux bureau de poste de développement.
    environment:
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM: ${MAIL_FROM:-site@auxcreasdemarie.local}
      MAIL_TO: ${MAIL_TO:-marie@auxcreasdemarie.local}
    depends_on:
      - mysql
      - mailpit

  # Mailpit : un faux bureau de poste pour le développement.
  # Il attrape tous les emails envoyés par le site (aucun ne part vraiment).
  # On les lit sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: creas_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  mysql_data: